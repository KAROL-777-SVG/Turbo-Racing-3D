
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Turbo Racing 3D</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { overflow:hidden; background:#000; font-family:'Segoe UI',sans-serif; }
  #game { width:100vw; height:100vh; display:block; }
  #hud {
    position:fixed; top:15px; left:15px; color:#0ff; font-size:18px;
    text-shadow:0 0 10px #0ff; pointer-events:none; z-index:10;
  }
  #hud div { margin-bottom:6px; }
  #nitroBar {
    position:fixed; bottom:25px; left:50%; transform:translateX(-50%);
    width:250px; height:14px; background:rgba(0,0,0,0.6);
    border:2px solid #0ff; border-radius:10px; overflow:hidden; z-index:10;
  }
  #nitroFill { height:100%; width:0%; background:linear-gradient(90deg,#0ff,#f0f); transition:width 0.1s; }
  #controls {
    position:fixed; bottom:20px; right:20px; z-index:10;
    display:flex; flex-direction:column; gap:10px; align-items:flex-end;
  }
  .ctrl-btn {
    width:70px; height:70px; border-radius:50%;
    background:rgba(0,255,255,0.15); border:2px solid #0ff;
    color:#0ff; font-size:24px; font-weight:bold;
    touch-action:none; user-select:none;
  }
  .ctrl-btn:active { background:rgba(0,255,255,0.5); }
  #steerBtns { display:flex; gap:10px; }
  #overlay {
    position:fixed; inset:0; background:rgba(0,0,0,0.85);
    display:flex; flex-direction:column; justify-content:center; align-items:center;
    z-index:100; color:#fff; text-align:center;
  }
  #overlay h1 { font-size:48px; color:#0ff; text-shadow:0 0 20px #0ff; margin-bottom:20px; }
  #overlay p { font-size:18px; margin-bottom:30px; color:#aaa; }
  #overlay button {
    padding:15px 50px; font-size:20px; background:linear-gradient(90deg,#0ff,#f0f);
    border:none; border-radius:30px; color:#000; font-weight:bold; cursor:pointer;
  }
  #overlay button:hover { transform:scale(1.05); }
  .hidden { display:none !important; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div>🏁 LAP: <span id="lap">1</span>/3</div>
  <div>⏱ <span id="time">0.00</span>s</div>
  <div>🚗 SPEED: <span id="speed">0</span> km/h</div>
  <div>🏆 POS: <span id="pos">1</span>/3</div>
</div>
<div id="nitroBar"><div id="nitroFill"></div></div>
<div id="controls">
  <div id="steerBtns">
    <button class="ctrl-btn" id="btnLeft">◀</button>
    <button class="ctrl-btn" id="btnRight">▶</button>
  </div>
  <button class="ctrl-btn" id="btnNitro">🔥</button>
</div>
<div id="overlay">
  <h1>TURBO RACING 3D</h1>
  <p>◀ ▶ — burilish &nbsp;|&nbsp; W/S — gaz/brake &nbsp;|&nbsp; SPACE — nitro</p>
  <button id="startBtn">START RACE</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>
<script type="module">
import * as THREE from 'three';

// ---------- SETUP ----------
const canvas = document.getElementById('game');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050510);
scene.fog = new THREE.Fog(0x050510, 60, 200);

const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.1, 1000);
camera.position.set(0, 6, 10);
camera.lookAt(0, 0, 0);

// ---------- LIGHTS ----------
scene.add(new THREE.AmbientLight(0xffffff, 0.4));
const sun = new THREE.DirectionalLight(0xffffff, 1.2);
sun.position.set(20, 40, 20);
sun.castShadow = true;
sun.shadow.mapSize.set(1024,1024);
scene.add(sun);
const neon = new THREE.PointLight(0x00ffff, 2, 50);
neon.position.set(0, 8, 0);
scene.add(neon);

// ---------- TRACK (loop) ----------
const TRACK_WIDTH = 12;
const TRACK_POINTS = [];
const R = 60;
for (let i = 0; i < 64; i++) {
  const a = (i/64) * Math.PI * 2;
  const r = R + Math.sin(a*3) * 15;
  TRACK_POINTS.push(new THREE.Vector3(Math.cos(a)*r, 0, Math.sin(a)*r));
}
const curve = new THREE.CatmullRomCurve3(TRACK_POINTS, true);
const trackGeo = new THREE.BufferGeometry();
const trackSegments = 400;
const positions = [];
const indices = [];
const up = new THREE.Vector3(0,1,0);
for (let i = 0; i <= trackSegments; i++) {
  const t = i / trackSegments;
  const p = curve.getPointAt(t);
  const tan = curve.getTangentAt(t);
  const side = new THREE.Vector3().crossVectors(up, tan).normalize();
  positions.push(p.x + side.x*TRACK_WIDTH/2, 0.01, p.z + side.z*TRACK_WIDTH/2);
  positions.push(p.x - side.x*TRACK_WIDTH/2, 0.01, p.z - side.z*TRACK_WIDTH/2);
  if (i < trackSegments) {
    const a = i*2, b = i*2+1, c = i*2+2, d = i*2+3;
    indices.push(a,b,c, b,d,c);
  }
}
trackGeo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
trackGeo.setIndex(indices);
trackGeo.computeVertexNormals();
const trackMat = new THREE.MeshStandardMaterial({ color:0x222233, metalness:0.6, roughness:0.4 });
const trackMesh = new THREE.Mesh(trackGeo, trackMat);
trackMesh.receiveShadow = true;
scene.add(trackMesh);

// track side neon lines
const lineGeo = new THREE.BufferGeometry();
const linePos = [];
for (let i = 0; i <= trackSegments; i++) {
  const t = i / trackSegments;
  const p = curve.getPointAt(t);
  const tan = curve.getTangentAt(t);
  const side = new THREE.Vector3().crossVectors(up, tan).normalize();
  linePos.push(p.x + side.x*TRACK_WIDTH/2, 0.05, p.z + side.z*TRACK_WIDTH/2);
}
lineGeo.setAttribute('position', new THREE.Float32BufferAttribute(linePos, 3));
const lineMat = new THREE.LineBasicMaterial({ color:0x00ffff });
scene.add(new THREE.Line(lineGeo, lineMat));
const line2 = new THREE.Line(lineGeo.clone(), new THREE.LineBasicMaterial({ color:0xff00ff }));
line2.geometry.attributes.position.array.forEach((v,i,arr) => {
  if (i%3 !== 1) arr[i] = -arr[i];
});
line2.geometry.attributes.position.needsUpdate = true;
scene.add(line2);

// ground
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(500,500),
  new THREE.MeshStandardMaterial({ color:0x0a0a1a, metalness:0.2, roughness:1 })
);
ground.rotation.x = -Math.PI/2;
ground.position.y = -0.5;
ground.receiveShadow = true;
scene.add(ground);

// ---------- CAR FACTORY ----------
function makeCar(color) {
  const g = new THREE.Group();
  const bodyMat = new THREE.MeshStandardMaterial({ color, metalness:0.8, roughness:0.2 });
  const body = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.6, 4), bodyMat);
  body.position.y = 0.6;
  body.castShadow = true;
  g.add(body);
  const cabin = new THREE.Mesh(
    new THREE.BoxGeometry(1.4, 0.5, 1.8),
    new THREE.MeshStandardMaterial({ color:0x111111, metalness:0.9, roughness:0.1 })
  );
  cabin.position.set(0, 1.1, -0.2);
  cabin.castShadow = true;
  g.add(cabin);
  // wheels
  const wheelGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.3, 16);
  const wheelMat = new THREE.MeshStandardMaterial({ color:0x111111 });
  const wp = [[-0.9,0.4,1.3],[0.9,0.4,1.3],[-0.9,0.4,-1.3],[0.9,0.4,-1.3]];
  wp.forEach(([x,y,z]) => {
    const w = new THREE.Mesh(wheelGeo, wheelMat);
    w.rotation.z = Math.PI/2;
    w.position.set(x,y,z);
    w.castShadow = true;
    g.add(w);
  });
  // headlights
  const lightMat = new THREE.MeshBasicMaterial({ color:0xffffaa });
  const hl = new THREE.Mesh(new THREE.BoxGeometry(1.6,0.15,0.1), lightMat);
  hl.position.set(0, 0.6, 2.05);
  g.add(hl);
  // neon underglow
  const glow = new THREE.PointLight(color, 1.5, 6);
  glow.position.set(0, 0.2, 0);
  g.add(glow);
  return g;
}

// ---------- PLAYER ----------
const player = makeCar(0x00ffff);
scene.add(player);

// ---------- AI CARS ----------
const aiCars = [];
for (let i = 0; i < 2; i++) {
  const ai = makeCar(i===0 ? 0xff00ff : 0xffaa00);
  ai.userData = { t: (i+1)*0.1, speed: 0.0055 };
  scene.add(ai);
  aiCars.push(ai);
}

// ---------- STATE ----------
const state = {
  running: false,
  speed: 0,
  maxSpeed: 0.35,
  accel: 0.004,
  brake: 0.02,
  friction: 0.002,
  steer: 0,
  t: 0,
  lap: 1,
  totalLaps: 3,
  nitro: 0,
  nitroActive: false,
  startTime: 0,
  finished: false,
  pos: 1,
};
const keys = {};

// ---------- INPUT ----------
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space') state.nitroActive = true;
});
addEventListener('keyup', e => {
  keys[e.code] = false;
  if (e.code === 'Space') state.nitroActive = false;
});

const btnLeft = document.getElementById('btnLeft');
const btnRight = document.getElementById('btnRight');
const btnNitro = document.getElementById('btnNitro');
btnLeft.addEventListener('touchstart', e=>{e.preventDefault(); keys['ArrowLeft']=true;});
btnLeft.addEventListener('touchend', e=>{e.preventDefault(); keys['ArrowLeft']=false;});
btnRight.addEventListener('touchstart', e=>{e.preventDefault(); keys['ArrowRight']=true;});
btnRight.addEventListener('touchend', e=>{e.preventDefault(); keys['ArrowRight']=false;});
btnNitro.addEventListener('touchstart', e=>{e.preventDefault(); state.nitroActive=true;});
btnNitro.addEventListener('touchend', e=>{e.preventDefault(); state.nitroActive=false;});
btnLeft.addEventListener('mousedown', ()=>keys['ArrowLeft']=true);
btnLeft.addEventListener('mouseup', ()=>keys['ArrowLeft']=false);
btnRight.addEventListener('mousedown', ()=>keys['ArrowRight']=true);
btnRight.addEventListener('mouseup', ()=>keys['ArrowRight']=false);
btnNitro.addEventListener('mousedown', ()=>state.nitroActive=true);
btnNitro.addEventListener('mouseup', ()=>state.nitroActive=false);

// ---------- GAME LOOP ----------
const clock = new THREE.Clock();
const tmpV = new THREE.Vector3();

function update(dt) {
  if (!state.running) return;

  // acceleration
  if (keys['KeyW'] || keys['ArrowUp']) state.speed += state.accel;
  if (keys['KeyS'] || keys['ArrowDown']) state.speed -= state.brake;
  if (!keys['KeyW'] && !keys['KeyS'] && !keys['ArrowUp'] && !keys['ArrowDown'])
    state.speed *= (1 - state.friction);

  // nitro
  if (state.nitroActive && state.nitro > 0) {
    state.speed += 0.006;
    state.nitro = Math.max(0, state.nitro - 1.5);
  } else if (!state.nitroActive) {
    state.nitro = Math.min(100, state.nitro + 0.4);
  }

  state.speed = Math.max(-0.1, Math.min(state.maxSpeed, state.speed));

  // steering
  const steerInput = (keys['ArrowLeft']?-1:0) + (keys['ArrowRight']?1:0);
  state.steer += (steerInput - state.steer) * 0.1;

  // move along curve
  state.t += state.speed * dt * 0.15;
  if (state.t > 1) { state.t -= 1; }
  if (state.t < 0) { state.t += 1; }

  const p = curve.getPointAt(state.t);
  const tan = curve.getTangentAt(state.t);
  const side = new THREE.Vector3().crossVectors(up, tan).normalize();

  // lateral offset for steering
  const lateral = state.steer * 4.5 * (state.speed / state.maxSpeed + 0.3);
  const clampedLateral = Math.max(-TRACK_WIDTH/2+1.2, Math.min(TRACK_WIDTH/2-1.2, lateral));

  player.position.copy(p).addScaledVector(side, clampedLateral);
  player.position.y = 0;

  // orient car
  const dir = tan.clone().addScaledVector(side, state.steer * 0.3).normalize();
  const lookAt = player.position.clone().add(dir);
  player.lookAt(lookAt);
  player.rotateY(0); // already looking forward

  // camera follow
  const camOffset = new THREE.Vector3(0, 5, -10).applyQuaternion(player.quaternion);
  camera.position.lerp(player.position.clone().add(camOffset), 0.1);
  camera.lookAt(player.position.clone().add(dir.clone().multiplyScalar(5)));

  // lap counter
  const prevT = state.t - state.speed * dt * 0.15;
  if (prevT > 0.9 && state.t < 0.1 && state.speed > 0) {
    state.lap++;
    if (state.lap > state.totalLaps && !state.finished) {
      state.finished = true;
      state.running = false;
      showFinish();
    }
  }
  if (prevT < 0.1 && state.t > 0.9 && state.speed < 0) state.lap = Math.max(1, state.lap-1);

  // AI
  aiCars.forEach((ai, i) => {
    ai.userData.t += (ai.userData.speed + (state.speed*0.3)) * dt * 0.15;
    if (ai.userData.t > 1) ai.userData.t -= 1;
    const ap = curve.getPointAt(ai.userData.t);
    const at = curve.getTangentAt(ai.userData.t);
    const aside = new THREE.Vector3().crossVectors(up, at).normalize();
    const aOffset = (i===0?-3:3);
    ai.position.copy(ap).addScaledVector(aside, aOffset);
    ai.position.y = 0;
    ai.lookAt(ai.position.clone().add(at));
  });

  // position calc (simplified)
  state.pos = 1;
  aiCars.forEach(ai => {
    const diff = ((ai.userData.t - state.t + 1) % 1);
    if (diff < 0.5) state.pos++;
  });

  // HUD
  document.getElementById('lap').textContent = Math.min(state.lap, state.totalLaps);
  document.getElementById('speed').textContent = Math.round(Math.abs(state.speed)*360);
  document.getElementById('pos').textContent = state.pos;
  document.getElementById('time').textContent = ((performance.now()-state.startTime)/1000).toFixed(2);
  document.getElementById('nitroFill').style.width = state.nitro + '%';
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  update(dt);
  neon.position.copy(player.position).add(new THREE.Vector3(0,8,0));
  renderer.render(scene, camera);
}
animate();

// ---------- START / FINISH ----------
document.getElementById('startBtn').addEventListener('click', () => {
  document.getElementById('overlay').classList.add('hidden');
  state.running = true;
  state.speed = 0;
  state.t = 0;
  state.lap = 1;
  state.nitro = 50;
  state.startTime = performance.now();
  state.finished = false;
});

function showFinish() {
  const overlay = document.getElementById('overlay');
  overlay.classList.remove('hidden');
  const totalTime = ((performance.now()-state.startTime)/1000).toFixed(2);
  overlay.innerHTML = `
    <h1>FINISH! 🏁</h1>
    <p>Vaqt: ${totalTime}s | Joy: ${state.pos}/3</p>
    <button id="restartBtn">QAYTA O'YNASH</button>
  `;
  document.getElementById('restartBtn').addEventListener('click', () => location.reload());
}

// ---------- RESIZE ----------
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
